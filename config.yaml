app:
  name: 大阪房源查询系统（本地版 MVP）
  mode: live
  output_root: ./data
schedule:
  enabled: true
  mode: random
  interval_hours: 2.0
  random_min_hours: 1.0
  random_max_hours: 3.0
  timezone: Asia/Tokyo
  window:
    start: 07:00
    end: '23:00'
  run_on_start: false
  random_min_minutes: 55.0
  random_max_minutes: 70.0
local_extract:
  enabled: true
  prefer_local: true
  min_fields: 8
  ocr_enabled: true
  ocr_dpi: 300
  ocr_lang: jpn
  ocr_timeout_sec: 60
  ocr_max_pages: 1
  tesseract_path: ''
  fallback_model: false
  fallback_max_per_run: 50
  ocr_enrich_important: true
schedule_ai:
  enabled: true
  timezone: local
  window:
    start: '23:00'
    end: 06:00
  max_per_run: 1000
  workers: 2
  run_on_start: false
  force_rerun: false
  backfill_all: false
  backfill_batch: 300
ai_read_scope:
- 売一戸建
- 売マンション
- 売土地
site:
  name: reins
  base_url: https://system.reins.jp
  login_url: https://system.reins.jp/login/main/KG/GKG001200
  search_url: https://system.reins.jp/main/BK/GBK001210
  bukken_search_url: https://system.reins.jp/main/BK/GBK004100
  detail_title_keyword: 物件詳細
browser:
  channel: msedge
  headless: false
  timeout_ms: 30000
  proxy: ''
auth:
  success_indicator: メインメニュー
  session_file: ./data/session.json
  manual_hint: 会话已失效。请到「设置 → 重新登录」点一次，手工登录后即可继续。
search:
  prefecture: 大阪府
  city: 大阪市
  kinds:
  - kind: 売一戸建
    subtypes:
    - 新築戸建
    - 中古戸建
  - kind: 売マンション
    subtypes:
    - 新築マンション
    - 中古マンション
  - kind: 売土地
    subtypes:
    - 土地
  use_saved_condition: false
  saved_conditions:
  - '01'
  - '02'
  update_groups:
  - kind: 売一戸建
    subtypes:
    - 新築戸建
    - 中古戸建
  - kind: 売マンション
    subtypes:
    - 新築マンション
    - 中古マンション
  - kind: 売マンション
    subtypes:
    - 新築タウン
    - 中古タウン
  geo_condition_by_kind:
    売一戸建: '01'
    売マンション: '02'
    売土地: '01'
crawl:
  delay_range_seconds:
  - 2.0
  - 4.0
  detail_gap_seconds:
  - 2.0
  - 4.0
  subquery_interval_seconds:
  - 10
  - 20
  split_subtypes: true
  split_new_changed: false
  reuse_axis_result: false
  operator_ask:
    enabled: true
    timeout_s: 15
    inline_fail_threshold: 5
  inline_detail: true
  main_round_enabled: false
  # v1.9.82 D1 解耦：阶段B（补详情+PDF）独立开关，默认开。
  #   历史：v1.9.6/1.9.7 已让阶段B 在 main_round=false 时仍跑（run_round 的 elif 降级分支
  #   调 _backfill_details_pdfs）；本开关把它从「隐式跟随主轮降级」升级为「显式独立可控」。
  #   主轮仍 false（勇哥 U3 拍板不动）；stage_b_enabled=false 时才会真正关掉补详情/PDF。
  stage_b_enabled: true
  # v1.9.82 RB-1：500 件上限应对。默认关 = 只告警不细分（PRD 建议「告警先做」）。
  #   开 = 检索撞 500 件上限时，自动按 REINS 可筛维度（地域/価格帯）拆细重试。
  #   ⚠ 拆细重试会增请求、有风控风险，未经验证前默认关；开启需真机 e2e 复核。
  auto_split_on_limit: false
  # v1.9.82 借地権：土地権利筛选开关（勇哥 09-25：新增开关 + 查询条件，但「暂先不抓」）。
  #   ownership = 勾「所有権のみ」（保持现状，不抓借地権）；all = 不勾（REINS 返回全部含借地権）。
  #   ⚠ all 路径需在真机复核 REINS 是否真返回借地権（B⑰ 沙箱禁公网），默认 ownership 零行为变化。
  rights_filter: ownership
  backfill_cap: 300
  backfill_max_minutes: 20
  sync_dates_enabled: true
  sync_dates_backfill_prev_day: true
  sync_dates_prev_day_cutoff: '20:00'
  delist_enabled: true
  delist_consecutive_runs: 2
  delay_long_range_seconds:
  - 10.0
  - 20.0
  delay_long_prob: 0.08
  skip_prob: 0.12
  list_page_pause_seconds:
  - 8
  - 20
  pdf_background: true
  pdf_max_inflight: 2
  flush_every: 1
  max_items_per_run: 5000
  page_size: 50
  max_pages: 10
  limit_warn: 450
  retry: 1
  max_minutes_per_group: 25
download:
  pdf: true
  images: false
  export_excel: true
  export_daily_page: true
web:
  host: 127.0.0.1
  port: 8765
selectors:
  collapse_toggle: a:has-text('検索条件を表示')
  saved_condition_select: div.p-label:has(span.p-label-title:has-text('保存した検索条件の選択'))
    + div select
  load_button: button:has-text('読込')
  search_button: button.btn-primary:has-text('検索')
  result_rows: div.p-table-body-row
  result_total: div.text-dark.ml-3
  next_page: button.page-link[aria-label="Go to next page"]
  detail_button: button:has-text('詳細'), a:has-text('詳細')
  detail_row: table.detail tr
  detail_label: th
  detail_value: td
  pdf_link: a:has-text('PDF'), a:has-text('図面'), button:has-text('図面')
  bukken_search_inputs: div.p-textbox.p-textbox-type-digit input.p-textbox-input
  bukken_search_button: div.p-frame-footer button.btn-primary:has-text('検索')
  bukken_result: ''
  image_item: div.photo img, ul.photoList li img
  login:
    id_field: input.p-textbox-input[type='text'], input[type='text']
    pw_field: input.p-textbox-input[type='password'], input[type='password']
    submit: button:has-text('ログイン'), button.p-button
    agree_checkbox: label:has-text('遵守します')
demo:
  daily_new: 60
  daily_change: 18
publish:
  enabled: true
  mode: auto
  endpoint: ''
  token: ''
  ingest_token: ''
  month_scope: ''
  scope_caliber: download
  batch_size: 200
  auto_enabled: true
  interval_minutes: 10
  full_repush_hours: 24
  date_from: ''
  date_to: ''
ai:
  api_key: ''
  model: doubao-seed-1.6
  base_url: https://ark.cn-beijing.volces.com/api/v3
public:
  access_code: ''
accounts:
  auth_enabled: true
