{% extends "base.html" %}
{% block title %}房源对比 · 大阪房源（本地版）{% endblock %}
{% block body %}

<div class="card hero cmp-hero">
  <div class="hero-main">
    <h1 data-i18n="cmp.h1">房源横向对比</h1>
    <p class="muted" data-i18n="cmp.sub">
      把 2–6 套房放进同一张表逐项对照：<b>地段 · 位置 · 价格 · 面积 · 建物 · 持有成本</b>。
      选中的房子记在本机浏览器里，刷新/切页面都不会丢；数据实时从本机库读，永远是最新的。
    </p>
  </div>
  <div class="hero-side">
    <a class="btn ghost" href="/search" data-i18n="cmp.back">← 回到房源查询</a>
    <button class="ghost" id="cmpClear" data-i18n="cmp.clear2">清空对比栏</button>
  </div>
</div>

<div class="card cmp-tools">
  <div class="cmp-toggles">
    <span class="muted" style="margin-right:2px" data-i18n="cmp.viewmode">查看方式：</span>
    <label class="sw"><input type="checkbox" id="tBest" checked> <span data-i18n="cmp.best">标出最优</span></label>
    <label class="sw"><input type="checkbox" id="tHideSame"> <span data-i18n="cmp.hidesame">隐藏相同项</span></label>
    <label class="sw"><input type="checkbox" id="tCore"> <span data-i18n="cmp.core">只看核心参数</span></label>
    <!-- v1.7.4 R3（PRD 11 §R3）：客户版 —— 勾上即隐藏中介公司/作业信息，这张表可以直接发给客人。
         以前只能「生成图 → 在 WPS 里手动删后半页」，现在一键完成。 -->
    <label class="sw"><input type="checkbox" id="tHideAgency"> <span data-i18n="cmp.hide_agency">隐藏中介信息（客户版）</span></label>
  </div>
  <span class="muted" id="cmpTip"></span>
</div>

<div id="cmpWrap">
  <div class="empty" data-i18n="cmp.loading">正在读取对比数据…</div>
</div>

<script>
var MAXC = 6;
var rows = [];          // 对比中的房源（后端返回，按选择顺序）
var meta = { over: 0, missing: [] };
var syncing = false;    // 用 URL 同步本地对比栏时避免重复渲染
var suppress = false;   // 自己主动改对比栏（清空 / 删列）时，别让 onChange 再插一脚去 load()

/* ---------- 取值器 ---------- */
function wanP(v){ return (v==null||v==='') ? '—' : (Math.round(Number(v)/10000)).toLocaleString() + ' 万円'; }
function m2(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString() + ' ㎡'; }
function raw(v){ return (v==null||v==='') ? '—' : String(v); }
/* 详情页「其他信息」里的金额类字段：数值补「円」+千分位，避免裸数字（如 1326000） */
function fmtExtra(k, v){
  if(v == null || v === '') return '—';
  // v1.7.2：统一走公共词典（有/无、円/㎡ 千分位、REINS 枚举翻中文）；词典没覆盖才走兜底
  if(window.fieldValue){
    var fv = window.fieldValue(k, v);
    if(fv !== '') return fv;
  }
  if(typeof v === 'number'){
    var s = v.toLocaleString();
    if(k === 'repair_fund' || k === 'management_fee') s += ' 円';
    return s;
  }
  return String(v);
}
function areaOf(r){ return r.exclusive_area || r.land_area || r.building_area || null; }
function unitPrice(r){
  if(r.unit_price_sqm) return r.unit_price_sqm;
  var a = areaOf(r);
  return (r.price && a) ? Math.round(r.price / a) : null;
}
function buildYear(r){
  var m = String(r.built_year_month || '').match(/(\d{4})/);
  return m ? parseInt(m[1], 10) : null;
}
function F(label, get, opt){
  opt = opt || {};
  return { label:label, get:get, core:!!opt.core, best:opt.best || null,
           bestLabel:opt.bestLabel || '', rawNum:opt.rawNum || null };
}

/* ---------- 字段表：分组 / 顺序 / 核心标记 / 比优方向 ---------- */
var SECTIONS = [
  { t:t('cmp.g.loc'), rows:[
      F(t('cmp.f.loc'),    function(r){ return r.address; },          {core:1}),
      F(t('cmp.f.ward'),    function(r){ return r.ward; },             {core:1}),
      F(t('cmp.f.line'),  function(r){ return r.line_station; },     {core:1}),
      F(t('cmp.f.bname'),  function(r){ return r.building_name; }),
      F(t('cmp.f.sub'),  function(r){ return r.property_subtype; }, {core:1}),
      F(t('cmp.f.kind'),      function(r){ return r.kind; }),
      F(t('cmp.f.no'),  function(r){ return r.property_no; })
  ]},
  { t:t('cmp.g.price'), rows:[
      F(t('cmp.f.price'),      function(r){
          // 平台历史变更（下载前已发生，来自 REINS「変更前価格」）→ 蓝底 + 「平台」标签 + 变更日
          var badge = '';
          if(r.previous_price && r.price && r.previous_price != r.price){
            var up = r.price > r.previous_price;
            var arrow = up ? '↑ ' : '↓ ';
            var pct = (Math.abs(r.previous_price - r.price) / Number(r.previous_price) * 100).toFixed(1) + '%';
            badge = '<span class="qrate qrate-platform">' + arrow + pct + '</span> ';
          }
          return badge + wanP(r.price);
        },
        // html:1 = 这个 getter 返回的是**带 HTML 的字符串**（涨跌徽章），渲染时不能再 esc()
        {core:1, best:'low',  bestLabel:t('cmp.bl.total'),   rawNum:function(r){ return r.price; }, html:1}),
      F(t('cmp.f.prev'),  function(r){ return r.previous_price ? wanP(r.previous_price) : '—'; }),
      F(t('cmp.f.drop'),function(r){
          if(!r.previous_price || !r.price || r.previous_price == r.price) return '—';
          var up = r.price > r.previous_price;
          var arrow = up ? '↑ ' : '↓ ';
          var src = '<span class="qsrc">' + t('row.src_platform')
                  + (r.change_date ? ' · ' + window.warekiToAD(r.change_date) : '') + '</span>';
          return '<span class="qdrop qdrop-platform">' + arrow + wanP(Math.abs(r.previous_price - r.price)) + ' ' + src + '</span>';
      }, {html:1}),   // html:1 = 返回带 HTML，渲染时不能再 esc()
      F(t('cmp.f.unit'),    function(r){ var u = unitPrice(r); return u ? (u/10000).toFixed(1) + ' 万円/㎡' : '—'; },
        {core:1, best:'low',  bestLabel:t('cmp.s.unit'), rawNum:unitPrice}),
      F(t('cmp.f.tsubo'),    function(r){ return r.unit_price_tsubo
          ? Math.round(r.unit_price_tsubo/10000).toLocaleString() + ' 万円/坪' : '—'; })
  ]},
  { t:t('cmp.g.area'), rows:[
      F(t('cmp.f.excl'),  function(r){ return m2(r.exclusive_area); },
        {core:1, best:'high', bestLabel:t('cmp.s.excl'), rawNum:function(r){ return r.exclusive_area; }}),
      F(t('cmp.f.land'),  function(r){ return m2(r.land_area); },
        {core:1, best:'high', bestLabel:t('cmp.s.land'), rawNum:function(r){ return r.land_area; }}),
      F(t('cmp.f.barea'),  function(r){ return m2(r.building_area); },
        {best:'high', bestLabel:t('cmp.bl.barea'), rawNum:function(r){ return r.building_area; }}),
      F(t('cmp.f.layout'),    function(r){ return r.layout; },           {core:1}),
      F(t('cmp.f.floor'),    function(r){ return r.floor; }),
      F(t('cmp.f.floors'),    function(r){ return r.above_ground_floors; })
  ]},
  { t:t('cmp.g.bld'), rows:[
      F(t('cmp.f.year'),    function(r){ return r.built_year_month; },
        {core:1, best:'high', bestLabel:t('cmp.s.year'), rawNum:buildYear}),
      // v1.5.3：image_count = -1 表示"还没抓详情、未知"，别显示成 0 枚，也不参与"最多"评选
      F(t('cmp.f.imgs'),    function(r){
          var n = r.image_count;
          if(n == null || n < 0) return '—';
          return n + ' 枚';
        },
        {best:'high', bestLabel:t('cmp.bl.imgs'),
         rawNum:function(r){ var n = r.image_count; return (n == null || n < 0) ? null : n; }})
  ]},
  { t:t('cmp.g.rec'), rows:[
      F(t('cmp.f.reg'),function(r){ return r.registration_date; }),
      F(t('cmp.f.chg'),function(r){ return r.change_date; }),
      F(t('cmp.f.first'),  function(r){ return r.first_seen_at; }),
      F(t('cmp.f.last'),  function(r){ return r.last_seen_at; })
  ]},
  { t:t('cmp.g.act'), rows:[
      F(t('cmp.f.pdf'),  function(r){ return r.pdf_url ? '__pdf__' : '—'; }),
      F(t('cmp.f.detail'),    function(r){ return '__detail__'; }),
      F(t('cmp.f.src'),    function(r){ return r.source_url ? '__src__' : '—'; })
  ]}
];

/* 字段名小词典已抽到公共文件 web/static/fieldmap.js（v1.2.0）——
   查询页展开区 / 对比页 / 详情页三处共用同一份「原始键 → 四语言」映射。
   这里保留一个薄包装 zh()，避免改动下面几十处调用点。 */
function zh(k){ return window.fieldLabel ? window.fieldLabel(k) : k; }

/* ---------- 小工具 ---------- */
function noOf(){
  var m = location.search.match(/[?&]nos=([^&]*)/);
  var list = (m && m[1]) ? decodeURIComponent(m[1]).split(',') : CompareBox.nos();
  var out = [];
  (list || []).forEach(function(x){ x = (x||'').trim(); if(x && out.indexOf(x) < 0) out.push(x); });
  return out.slice(0, MAXC);
}
function setCount(n){
  document.querySelectorAll('#nav-cmp-n, .js-cmp-n').forEach(function(el){
    el.textContent = n ? n : ''; el.style.display = n ? 'inline-block' : 'none';
  });
}
function isSame(vals){
  var xs = vals.filter(function(v){ return v != null && v !== '' && v !== '—'; });
  if(xs.length < 2) return true;
  return xs.every(function(v){ return String(v) === String(xs[0]); });
}
function numsOf(list, getNum){
  var out = [];
  list.forEach(function(r){
    var v = getNum(r);
    if(v == null || v === '' || isNaN(v)) return;
    out.push(Number(v));
  });
  return out;
}
function bestOf(list, getNum, dir){
  var n = numsOf(list, getNum);
  if(n.length < 2) return null;
  if(n.every(function(v){ return v === n[0]; })) return null;
  var bv = (dir === 'low') ? Math.min.apply(null, n) : Math.max.apply(null, n);
  var best = null;
  list.forEach(function(r){
    var v = getNum(r);
    if(v == null || v === '' || isNaN(v)) return;
    if(Number(v) === bv && !best) best = r;
  });
  return best;
}
function bestIdxOf(list, f){
  var best = bestOf(list, f.rawNum, f.best);
  return best ? list.indexOf(best) : -1;
}
function extraKeys(list){
  // v1.7.2：跳过规则统一交给公共词典（fieldmap.js → window.fieldSkip）：
  //   内部机器键、未收录键、页头已单独渲染的核心列，都不进对比表。
  // v1.7.4 R3：勾了「隐藏中介信息」→ 中介类字段整行不输出（不是置灰，是**不在表里**，
  //   这样导出/截图给客人时不会残留，也不必再去 WPS 里删）。
  var hideAgency = false;
  var _ag = document.getElementById('tHideAgency');
  if(_ag) hideAgency = !!_ag.checked;
  var skip = {};
  ['property_no','address','building_name','price','land_area','exclusive_area','building_area',
   'layout','floor','built_year_month','line_station','registration_date','change_date',
   'first_seen_at','last_seen_at','image_count','property_subtype','kind','ward','previous_price',
   'unit_price_sqm','unit_price_tsubo','above_ground_floors','pdf_path','source_url'].forEach(function(k){ skip[k]=1; });
  var set = {};
  list.forEach(function(r){
    Object.keys(r.detail || {}).forEach(function(k){
      if(k.charAt(0) === '_' || skip[k]) return;      // 本页已有专列 / 内部键
      if(window.fieldSkip && window.fieldSkip(k)) return;   // 公共词典：内部键 + 未收录键
      if(hideAgency && window.fieldAgency && window.fieldAgency(k)) return;  // R3 客户版
      if(r.detail[k] == null || r.detail[k] === '') return;
      set[k] = 1;
    });
  });
  return Object.keys(set).sort();
}

/* ---------- 「还不够 2 套」时的引导页 ----------
   对比的本质是「至少两套并排看」，只选了一套时页面空着会让人不知所措，
   所以这里说清楚：现在选了什么、还差几套、下一步点哪里。 */
function notEnoughHtml(){
  var sel = CompareBox.items();
  var h = '<div class="card"><h2>' + t('cmp.notenough') + '</h2>';
  if(sel.length === 1){
    var t0 = sel[0].name || sel[0].addr || sel[0].no;
    h += '<p>' + t('cmp.only1a') + ' <b>1</b> ' + t('cmp.only1b') + '：<b>' + esc(t0) + '</b>'
       + (sel[0].no ? ' <span class="mono muted">' + esc(sel[0].no) + '</span>' : '') + '。</p>'
       + '<p>' + t('cmp.only1c') + ' <b>1</b> ' + t('cmp.only1d') + '</p>'
       + '<div class="row" style="margin-top:10px">'
       +   '<a class="btn primary" href="/search">' + t('cmp.pick1') + '</a>'
       +   '<button class="ghost" id="cmpClear2">' + t('cmp.clear2') + '</button>'
       + '</div>';
  }else{
    h += '<p>' + t('cmp.none') + '<br>' + t('cmp.none2') + '<b>' + t('detail.tobank') + '</b>' + t('cmp.none3')
       + '<br>'
       + '<span class="muted">' + t('cmp.none4') + '</span></p>'
       + '<div class="row" style="margin-top:10px"><a class="btn primary" href="/search">' + t('cmp.gosearch') + '</a></div>';
  }
  h += '</div>';
  return h;
}
function bindNotEnough(){
  var b = document.getElementById('cmpClear2');
  if(b && !b.dataset.bound){
    b.dataset.bound = '1';
    b.addEventListener('click', clearAll);
  }
}

/* ---------- 加载 ---------- */
/* v1.8.6：load() 是 async 且**没有并发保护** —— 一旦被 onChange / storage / i18n:changed
   重复触发，多个 load() 会同时在跑、互相 clear()+add()，把对比栏写成空又写回（"清掉又回来"），
   并且每跑一轮就重渲染一次（页面狂闪）。这里加在途闸：同一时刻只跑一个 load()。 */
var _cmpLoading = false;
async function load(){
  if(_cmpLoading) return;
  _cmpLoading = true;
  try { await _loadBody(); } finally { _cmpLoading = false; }
}
async function _loadBody(){
  var wrap = document.getElementById('cmpWrap');
  var first = true;
  // v1.8.9 修「清空 / 删到最后一个后又全部恢复」的竞态根因：
  // 旧 load() 是 async，_cmpLoading 闸门会**丢弃**用户后续触发的 load()；
  // 而最早那次 load() 在 await api() 期间捕获的是「删除前的旧 nos」，返回后用
  // CompareBox.setAll() 把旧列表整个写回对比栏 → 表现就是「清掉又全回来 / 删到最后一个全出现」。
  // 修法：每次 await 回来都重新比对 noOf()，若与本次请求的 nos 不一致（等待期间用户又删/加），
  // 就**不带 setAll 地重跑一轮**（_cmpLoading 闸门仍开，绝不并发），直到 nos 稳定才落盘。
  // setAll 只刷新元数据 / 裁剪平台已下架项，绝不复活已删项。
  while(true){
    var nos = noOf();
    if(nos.length < 2){
      wrap.innerHTML = notEnoughHtml();
      bindNotEnough();
      setCount(CompareBox.count());
      return;
    }
    if(first){
      wrap.innerHTML = '<div class="empty">' + t('cmp.loading') + '</div>';
      first = false;
    }
    var j;
    try{ j = await api('/api/compare?nos=' + encodeURIComponent(nos.join(','))); }
    catch(e){ alertErr(e, t('cmp.readfail')); wrap.innerHTML = '<div class="empty">' + t('cmp.readfail') + '</div>'; return; }
    // 等待期间选择已变 → 丢弃这次结果，用最新 nos 重跑（不写回，避免复活已删项）
    if(JSON.stringify(noOf()) !== JSON.stringify(nos)) continue;

    rows = j.rows || [];
    meta = { over: j.over || 0, missing: j.missing || [] };

    // nos 已稳定：用后端确认结果校正本地对比栏（仅刷新地址/楼名/价格元数据 + 裁剪下架项）
    syncing = true;
    CompareBox.setAll(rows.map(function(r){
      return { no:r.property_no, addr:r.address, name:r.building_name,
               price:r.price, pdf:!!r.pdf_url };
    }));
    syncing = false;

    if(rows.length < 2){
      wrap.innerHTML = '<div class="card"><div class="empty">' + t('cmp.notfound')
        + '<br><br><a href="/search">' + t('cmp.backq') + '</a> 重新选。</div></div>';
      return;
    }
    render();
    return;
  }
}

/* ---------- 渲染 ---------- */
function render(){
  var core     = document.getElementById('tCore').checked;
  var hideSame = document.getElementById('tHideSame').checked;
  var mark     = document.getElementById('tBest').checked;
  var n = rows.length;

  document.getElementById('cmpTip').textContent =
      (meta.over ? t('cmp.over') + ' ' + MAXC + ' ' + t('cmp.ignore') + ' ' + meta.over + ' ' + t('cmp.skipped') : '')
    + (meta.missing.length ? ' ' + tf('cmp.missing', {n: meta.missing.length}) : '');

  var h = '';

  /* ① 一眼结论 */
  h += '<div class="card cmp-sum"><h2>' + t('cmp.summary.h') + ' <span class="hint">' + tf('cmp.summary.hint', {n:n}) + '</span></h2>'
    +  '<div class="sumgrid">';
  [[t('cmp.s.total'), function(r){ return r.price; },           'low',  wanP],
   [t('cmp.s.unit'),  unitPrice,                                'low',  function(v){ return v ? (v/10000).toFixed(1) + ' 万円/㎡' : '—'; }],
   [t('cmp.s.excl'),  function(r){ return r.exclusive_area; }, 'high', m2],
   [t('cmp.s.land'),  function(r){ return r.land_area; },       'high', m2],
   [t('cmp.s.year'),  buildYear,                                'high', function(v){ return v ? v + ' 年' : '—'; }]
  ].forEach(function(m){
    var best = bestOf(rows, m[1], m[2]);
    if(!best) return;
    h += '<div class="sumitem"><div class="sl">' + m[0] + '</div>'
      +  '<div class="sv">' + esc(m[3](m[1](best))) + '</div>'
      +  '<div class="sn" title="' + esc(best.address || '') + '">'
      +  esc(best.building_name || best.address || best.property_no) + '</div></div>';
  });
  h += '</div></div>';

  /* ② 主表（grid：第 1 列是项目名，后面每列一套房） */
  h += '<p class="cmp-hint">' + tf('cmp.hint.slide', {n:n}) + '</p>';
  h += '<div class="card cmp-card"><div class="cmpscroll"><div class="cmptable" style="--cols:' + n + '">';

  h += '<div class="cl cl-head">' + t('cmp.cfg') + '</div>';
  rows.forEach(function(r){
    // v1.2.0：列头卡片精简为「位置 / 名称 / 价格 / 専有面積」四项。
    // 去掉原来的「物件種目 + 面积文字 + 有PDF」那一行（用户明确不要）；
    // 下方的「配置状况」主表（含 PDF 行）保持原样，不做删减。
    h += '<div class="cc cc-head">'
      +  '<button class="x" onclick="dropCol(\'' + esc(r.property_no) + '\')" title="' + t('cmp.drop') + '">×</button>'
      +  '<div class="ad" title="' + esc(r.address || '') + '">' + esc(r.address || '—') + '</div>'
      +  '<div class="nm" title="' + esc(r.building_name || '') + '">'
      +    esc(r.building_name || r.address || r.property_no) + '</div>'
      +  '<div class="pr">' + wanP(r.price) + '</div>'
      +  '<div class="ar">' + m2(areaOf(r)) + '</div>'
      +  '<a class="btn ghost tiny" href="/p/' + encodeURIComponent(r.property_no)
      +    '" target="_blank">' + t('cmp.detail') + '</a>'
      +  '</div>';
  });

  SECTIONS.forEach(function(sec){
    var body = '';
    sec.rows.forEach(function(f){
      if(core && !f.core) return;
      var vals = rows.map(f.get);
      if(hideSame && isSame(vals)) return;
      var bi = (mark && f.best) ? bestIdxOf(rows, f) : -1;
      body += '<div class="cl' + (f.core ? ' k' : '') + '">' + esc(f.label) + '</div>';
      rows.forEach(function(r, i){
        var v = vals[i];
        var cell;
        if(v === '__pdf__')         cell = '<a class="btn tiny" href="' + r.pdf_url + '" target="_blank">' + t('cmp.pdfc') + '</a>';
        else if(v === '__detail__') cell = '<a class="btn ghost tiny" href="/p/'
                                          + encodeURIComponent(r.property_no) + '" target="_blank">' + t('cmp.srcpage') + '</a>';
        else if(v === '__src__')    cell = '<a class="link" href="' + esc(r.source_url) + '" target="_blank">' + t('cmp.srcsite') + '</a>';
        // v1.8.6 修「对比页把 <span class="qrate">↑ 18.2%</span> 当纯文本吐出来」：
        // 价格 / 降价幅 的 getter **返回的就是 HTML**（涨跌徽章），这里再 esc() 一次
        // 就把标签转义成字面文本了。带 html:1 标记的字段直接原样插入。
        else if(f.html)             cell = raw(v);
        else                        cell = esc(raw(v));
        body += '<div class="cc' + (i === bi ? ' best' : '')
              + (v == null || v === '' || v === '—' ? ' nil' : '') + '">'
              +  cell + (i === bi ? '<span class="bt">' + esc(f.bestLabel || t('cmp.best_def')) + '</span>' : '')
              +  '</div>';
      });
    });
    if(!body) return;
    h += '<div class="cmpgroup">' + esc(sec.t) + '</div>' + body;
  });

  /* ③ 详情页抓到的其他字段（并集） */
  if(!core){
    var body2 = '';
    extraKeys(rows).forEach(function(k){
      var vals = rows.map(function(r){ return (r.detail || {})[k]; });
      if(hideSame && isSame(vals)) return;
      body2 += '<div class="cl">' + esc(zh(k)) + '</div>';
      rows.forEach(function(r){
        var v = (r.detail || {})[k];
        if(v != null && typeof v === 'object') v = JSON.stringify(v);
        body2 += '<div class="cc' + (v == null || v === '' ? ' nil' : '') + '">' + esc(fmtExtra(k, v)) + '</div>';
      });
    });
    if(body2){
      h += '<div class="cmpgroup">' + t('cmp.extra') + '</div>' + body2;
    }
  }

  h += '</div></div></div>';
  document.getElementById('cmpWrap').innerHTML = h;
}

/* ---------- 交互 ---------- */
function dropCol(no){
  suppress = true; CompareBox.remove(no); suppress = false;   // 先改本地，别触发 onChange 里的自动 load
  var nos = CompareBox.nos();
  history.replaceState(null, '', '/compare' + (nos.length ? '?nos=' + encodeURIComponent(nos.join(',')) : ''));
  rows = [];        // 清掉旧表，避免 load() 期间还显示被删掉的那一列
  load();
}
/* 清空对比栏：先把地址栏的 ?nos= 去掉，再清本地选中，最后重载显示引导页。
   顺序很关键 —— 反过来的话，onChange 里的自动 load() 会读到旧 URL 又把房子加回来。 */
function clearAll(){
  if(!CompareBox.count()) return;
  history.replaceState(null, '', '/compare');
  suppress = true; CompareBox.clear(); suppress = false;
  rows = [];
  load();
}
document.getElementById('cmpClear').addEventListener('click', function(){
  if(!CompareBox.count()) return;
  if(confirm(t('cmp.confirm_clear'))) clearAll();
});
['tBest','tHideSame','tCore','tHideAgency'].forEach(function(id){
  var el = document.getElementById(id);
  if(el) el.addEventListener('change', function(){ if(rows.length) render(); });
});
CompareBox.onChange(function(items){
  setCount(items.length);
  if(suppress || syncing) return;
  // v1.8.7 修「清空/删到最后一个后全部恢复」的复活源头：
  // 旧代码是 if(!items.length && rows.length){ rows=[]; load(); }
  // —— 一旦对比栏被清空（无论是在本页清空，还是在查询页/另一标签页清空），
  //    这里都会自动 load()，而 load() 会拿**地址栏里残留的旧 ?nos=** 把那几套房
  //    重新写回 CompareBox → 表现就是"清空了又全回来"、"删到最后一个又全出现"。
  // 现在改成：清空就只显示引导页，**绝不顺着旧 URL 重新装载**；
  // 同时把地址栏残留的 ?nos= 也清掉，彻底断掉复活路径。
  if(!items.length){
    rows = [];
    try{ history.replaceState(null, '', '/compare'); } catch(e){}
    var w = document.getElementById('cmpWrap');
    if(w){ w.innerHTML = notEnoughHtml(); bindNotEnough(); setCount(0); }
    return;
  }
  if(!items.length && rows.length){ rows = []; load(); }
});

window.addEventListener('i18n:changed', function(){
  try{
    if(rows.length >= 2) render();
    else { var w = document.getElementById('cmpWrap'); if(w){ w.innerHTML = notEnoughHtml(); bindNotEnough(); setCount(CompareBox.count()); } }
  }catch(e){}
});

load();
</script>
